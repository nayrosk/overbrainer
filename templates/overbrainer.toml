# overbrainer project configuration.
# URLs, hosts and secrets never go here: set them through OVERBRAINER_* env vars (see .env.example).

[project]
name = "my_project"

[[topics]]
name = "ownership"
description = "Rust ownership, borrowing and lifetimes"
subtopics = 10
questions_per_subtopic = 30

[providers.openrouter]
protocol = "openai"

[roles]
generator = { provider = "openrouter", model = "qwen/qwen3-235b-a22b" }
parent = { provider = "openrouter", model = "deepseek/deepseek-r1", reasoning = true }
# Optional on every role: max_tokens (default 16384), temperature (0 to 2),
# reasoning_effort ("low", "medium" or "high", only with reasoning = true).
# thinking_budget = 8000  # anthropic only; Claude Opus 4.5, Sonnet 4.5 and Haiku 4.5 need this
# (fixed budget) instead of adaptive thinking; leave unset for newer Claude models.
# embedder = { provider = "openrouter", model = "openai/text-embedding-3-small" }

[pipeline]
concurrency = 8
max_retries = 5
dedup_threshold = 0.8
eval_ratio = 0.1
seed = 42
include_system_prompt = false
# embedding_threshold = 0.9     # used only when roles.embedder is set
# question_batch_size = 10
# request_timeout_secs = 600

[training]
target = "local"
base_model = "Qwen/Qwen3-4B"   # HF repo ID or a path on the target
adapter = "qlora"              # lora | qlora | full
# epochs = 3
# learning_rate = 2e-4
# lora_r = 16
# lora_alpha = 32
# lora_dropout = 0.05
# sequence_len = 4096
# micro_batch_size = 2
# gradient_accumulation_steps = 4
# optimizer = "adamw_torch_fused"
# lr_scheduler = "cosine"
# sample_packing = true
# evals_per_epoch = 4
# saves_per_epoch = 1
# merge = false                # also write a merged model (lora and qlora only)
# hub_model_id = "user/model"  # push the adapter to a private Hub repo (needs OVERBRAINER_HF_TOKEN)
# [training.axolotl_extra]     # merged into the Axolotl YAML
# warmup_ratio = 0.1
# attn_implementation = "flash_attention_2"

[targets.local]
kind = "local"
runtime = "native"             # native | docker
# venv = "~/.venvs/axolotl"    # native: directory holding bin/axolotl
# engine = "docker"            # docker: docker | podman
# image = "axolotlai/axolotl:0.19.0-py3.12-cu130-2.12.1"

# [targets.homelab]
# kind = "ssh"                 # host comes from OVERBRAINER_TARGETS__HOMELAB__HOST
# runtime = "docker"
# workdir = "overbrainer"      # on the remote machine, relative to its home directory
