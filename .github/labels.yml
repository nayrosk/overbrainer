# Source of truth for the repository labels, synced by .github/workflows/labels.yml.
# A label missing from this file is deleted from the repository on the next sync.

# Type
- name: bug
  color: "#d73a4a"
  description: Something isn't working
- name: enhancement
  color: "#a2eeef"
  description: New feature or request
- name: documentation
  color: "#0075ca"
  description: Improvements or additions to documentation
- name: security
  color: "#b60205"
  description: Security fix or hardening
- name: ci
  color: "#1d76db"
  description: Continuous integration and workflows
- name: chore
  color: "#c5def5"
  description: Maintenance with no user-facing change
- name: refactor
  color: "#fbca04"
  description: Code change that neither fixes a bug nor adds a feature
- name: performance
  color: "#5319e7"
  description: Faster or lighter

# Area
- name: "area: cli"
  color: "#bfdadc"
  description: Commands, flags and shell completions
- name: "area: tui"
  color: "#bfdadc"
  description: Terminal user interface
- name: "area: pipeline"
  color: "#bfdadc"
  description: Subtopics, questions, answers, dedup and split
- name: "area: training"
  color: "#bfdadc"
  description: Fine-tuning, locally or over SSH
- name: "area: runpod"
  color: "#bfdadc"
  description: Runpod GPU pods
- name: "area: skill"
  color: "#bfdadc"
  description: Agent skill and Claude Code plugin

# Status
- name: triage
  color: "#ededed"
  description: Needs a first look
- name: blocked
  color: "#e11d21"
  description: Waiting on something else
- name: breaking-change
  color: "#d93f0b"
  description: Changes public behavior or the library API
- name: release
  color: "#0e8a16"
  description: Release pull request

# Dependabot
- name: dependencies
  color: "#0366d6"
  description: Pull requests that update a dependency file
- name: rust
  color: "#dea584"
  description: Pull requests that update Rust dependencies
- name: github_actions
  color: "#000000"
  description: Pull requests that update GitHub Actions code

# Resolution and community
- name: good first issue
  color: "#7057ff"
  description: Good for newcomers
- name: help wanted
  color: "#008672"
  description: Extra attention is needed
- name: question
  color: "#d876e3"
  description: Further information is requested
- name: duplicate
  color: "#cfd3d7"
  description: This issue or pull request already exists
- name: invalid
  color: "#e4e669"
  description: This doesn't seem right
- name: wontfix
  color: "#ffffff"
  description: This will not be worked on
