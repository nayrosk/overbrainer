name: ci

# Every job name below is a required status check in the `main` ruleset.
# Renaming or removing a job needs the same change in the ruleset, or no
# pull request can merge.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch; toolchain set below
        with:
          toolchain: "stable"
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch; toolchain set below
        with:
          toolchain: "stable"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Clippy with the built-in SSH client
        run: cargo clippy --all-targets --locked --features builtin-ssh -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch; toolchain set below
        with:
          toolchain: "stable"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install PyYAML for the YAML round trip test
        run: |
          python3 -m pip install --break-system-packages pyyaml
          python3 -c 'import yaml'
      - name: Install the shells the generated scripts are tested under
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y dash busybox-static
          dash -c 'echo dash ready'
          busybox sh -c 'echo busybox ready'
          curl --version
      - run: cargo test --all-targets --locked
        env:
          # A missing or changed TUI snapshot fails the test; nothing is written.
          INSTA_UPDATE: "no"
      - name: Test with the built-in SSH client
        run: cargo test --all-targets --locked --features builtin-ssh
        env:
          INSTA_UPDATE: "no"

  ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      sshd:
        image: linuxserver/openssh-server:10.3_p1-r1-ls237@sha256:946fa26105e0ec212fdf821b9ddc59aab65f2c2d07c02b25ff0f5001fc332ff0
        ports:
          - 2222:2222
        env:
          USER_NAME: overbrainer
      # A jump host for ProxyJump: reaches the target as sshd:2222 on the
      # services' network.
      bastion:
        image: linuxserver/openssh-server:10.3_p1-r1-ls237@sha256:946fa26105e0ec212fdf821b9ddc59aab65f2c2d07c02b25ff0f5001fc332ff0
        ports:
          - 2223:2222
        env:
          USER_NAME: overbrainer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch; toolchain set below
        with:
          toolchain: "stable"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Authorize a throwaway key on the test sshd and the bastion
        env:
          SSHD: ${{ job.services.sshd.id }}
          BASTION: ${{ job.services.bastion.id }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/overbrainer_test
          for container in "$SSHD" "$BASTION"; do
            for _ in $(seq 1 60); do
              docker exec "$container" test -f /config/.ssh/authorized_keys && break
              sleep 1
            done
            docker exec -i "$container" sh -c 'cat >> /config/.ssh/authorized_keys' < ~/.ssh/overbrainer_test.pub
          done
          # The compare job and its fake llama-server run on python3, which
          # the image lacks.
          docker exec "$SSHD" apk add --no-cache python3
          # The image turns TCP forwarding off; the bastion needs it. SIGHUP
          # makes sshd read its config again, once sshd has written its pid.
          for _ in $(seq 1 60); do
            docker exec "$BASTION" test -s /config/sshd.pid && break
            sleep 1
          done
          if ! docker exec "$BASTION" test -s /config/sshd.pid; then
            echo "the bastion's sshd wrote no pid file within 60s" >&2
            exit 1
          fi
          docker exec "$BASTION" sh -c 'sed -i "s/^AllowTcpForwarding no/AllowTcpForwarding yes/" /config/sshd/sshd_config && kill -HUP "$(cat /config/sshd.pid)"'
          # Appends the host keys the command "$@" prints, once it prints some.
          scan() {
            for _ in $(seq 1 60); do
              keys=$("$@" 2>/dev/null || true)
              if [ -n "$keys" ]; then
                echo "$keys" >> ~/.ssh/overbrainer_known_hosts
                return 0
              fi
              sleep 1
            done
            echo "no host keys from: $*" >&2
            return 1
          }
          : > ~/.ssh/overbrainer_known_hosts
          scan ssh-keyscan -p 2222 127.0.0.1
          scan ssh-keyscan -p 2223 127.0.0.1
          # The target as the bastion reaches it.
          scan docker exec "$BASTION" ssh-keyscan -p 2222 sshd
          cat > ~/.ssh/overbrainer_config <<EOF
          Host overbrainer-test
            HostName 127.0.0.1
            Port 2222
            User overbrainer
            IdentityFile $HOME/.ssh/overbrainer_test
            IdentitiesOnly yes
            UserKnownHostsFile $HOME/.ssh/overbrainer_known_hosts
          Host overbrainer-bastion
            HostName 127.0.0.1
            Port 2223
            User overbrainer
            IdentityFile $HOME/.ssh/overbrainer_test
            IdentitiesOnly yes
            UserKnownHostsFile $HOME/.ssh/overbrainer_known_hosts
          Host overbrainer-behind
            HostName sshd
            Port 2222
            User overbrainer
            ProxyJump overbrainer-bastion
            IdentityFile $HOME/.ssh/overbrainer_test
            IdentitiesOnly yes
            UserKnownHostsFile $HOME/.ssh/overbrainer_known_hosts
          EOF
          echo "OVERBRAINER_TEST_SSH_CONFIG=$HOME/.ssh/overbrainer_config" >> "$GITHUB_ENV"
      - name: Test the SSH executor and Runpod pod access against the sshd
        env:
          OVERBRAINER_TEST_SSH_HOST: overbrainer-test
          OVERBRAINER_TEST_SSH_JUMP_HOST: overbrainer-behind
        run: 'cargo test --locked --test it -- exec_ssh:: runpod_ssh::'
      - name: Test them again with the built-in client
        env:
          OVERBRAINER_TEST_SSH_HOST: overbrainer-test
          OVERBRAINER_TEST_SSH_JUMP_HOST: overbrainer-behind
          OVERBRAINER_TEST_SSH_CLIENT: builtin
        run: 'cargo test --locked --features builtin-ssh --test it -- exec_ssh:: runpod_ssh::'

  doc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch; toolchain set below
        with:
          toolchain: "stable"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo doc --no-deps --locked
      - name: Doc with the built-in SSH client
        run: cargo doc --no-deps --locked --features builtin-ssh

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch; toolchain set below
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --all-targets --locked
      - name: Check with the built-in SSH client
        run: cargo check --all-targets --locked --features builtin-ssh

  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch; toolchain set below
        with:
          toolchain: "stable"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --all-targets --locked

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features

  crates-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the categories and keywords crates.io accepts
        # `cargo publish --dry-run` does not check them; crates.io refuses the
        # upload itself when a category slug is unknown.
        run: |
          curl -fsS -A "overbrainer-ci (https://github.com/nayrosk/overbrainer)" \
            https://crates.io/api/v1/category_slugs > slugs.json
          python3 - <<'EOF'
          import json, re, sys, tomllib
          package = tomllib.load(open("Cargo.toml", "rb"))["package"]
          known = {c["slug"] for c in json.load(open("slugs.json"))["category_slugs"]}
          problems = [f"unknown category: {c}" for c in package.get("categories", []) if c not in known]
          keywords = package.get("keywords", [])
          if len(keywords) > 5:
              problems.append(f"{len(keywords)} keywords, crates.io takes 5 at most")
          problems += [
              f"invalid keyword: {k}"
              for k in keywords
              if len(k) > 20 or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_\-+]*", k)
          ]
          for problem in problems:
              print(f"::error file=Cargo.toml::{problem}")
          sys.exit(1 if problems else 0)
          EOF

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check Conventional Commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9_-]+\))?!?: .+'
          status=0
          while IFS= read -r subject; do
            if ! printf '%s\n' "$subject" | grep -Eq "$pattern"; then
              echo "::error::Not a Conventional Commit: $subject"
              status=1
            fi
          # Merge commits from "Update branch" vanish in the squash; skip them.
          done < <(git log --no-merges --format=%s "$BASE..$HEAD")
          exit $status

  branch:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Conventional Branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          pattern='^((feature|feat|bugfix|fix|hotfix|chore)/[a-z0-9]+(-[a-z0-9]+)*|(release/v|chore/release-v)[0-9]+\.[0-9]+\.[0-9]+([-.][a-z0-9.]+)?|dependabot/.+)$'
          if ! printf '%s\n' "$BRANCH" | grep -Eq "$pattern"; then
            echo "::error::Branch name does not follow Conventional Branch: $BRANCH"
            exit 1
          fi
