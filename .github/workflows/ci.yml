name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch; toolchain set below
        with:
          toolchain: "stable"
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch; toolchain set below
        with:
          toolchain: "stable"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch; toolchain set below
        with:
          toolchain: "stable"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --all-targets --locked

  ssh:
    runs-on: ubuntu-latest
    services:
      sshd:
        image: linuxserver/openssh-server:10.3_p1-r1-ls237@sha256:946fa26105e0ec212fdf821b9ddc59aab65f2c2d07c02b25ff0f5001fc332ff0
        ports:
          - 2222:2222
        env:
          USER_NAME: overbrainer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch; toolchain set below
        with:
          toolchain: "stable"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Authorize a throwaway key on the test sshd
        env:
          SSHD: ${{ job.services.sshd.id }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/overbrainer_test
          for _ in $(seq 1 60); do
            docker exec "$SSHD" test -f /config/.ssh/authorized_keys && break
            sleep 1
          done
          docker exec -i "$SSHD" sh -c 'cat >> /config/.ssh/authorized_keys' < ~/.ssh/overbrainer_test.pub
          for _ in $(seq 1 60); do
            ssh-keyscan -p 2222 127.0.0.1 > ~/.ssh/overbrainer_known_hosts 2>/dev/null
            [ -s ~/.ssh/overbrainer_known_hosts ] && break
            sleep 1
          done
          cat > ~/.ssh/overbrainer_config <<EOF
          Host overbrainer-test
            HostName 127.0.0.1
            Port 2222
            User overbrainer
            IdentityFile $HOME/.ssh/overbrainer_test
            IdentitiesOnly yes
            UserKnownHostsFile $HOME/.ssh/overbrainer_known_hosts
          EOF
          echo "OVERBRAINER_TEST_SSH_CONFIG=$HOME/.ssh/overbrainer_config" >> "$GITHUB_ENV"
      - name: Test the SSH executor against the sshd
        env:
          OVERBRAINER_TEST_SSH_HOST: overbrainer-test
        run: cargo test --locked --test exec_ssh

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch; toolchain set below
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --all-targets --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check Conventional Commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9_-]+\))?!?: .+'
          status=0
          while IFS= read -r subject; do
            if ! printf '%s\n' "$subject" | grep -Eq "$pattern"; then
              echo "::error::Not a Conventional Commit: $subject"
              status=1
            fi
          done < <(git log --format=%s "$BASE..$HEAD")
          exit $status

  branch:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check Conventional Branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          pattern='^((feature|feat|bugfix|fix|hotfix|chore)/[a-z0-9]+(-[a-z0-9]+)*|release/v[0-9]+\.[0-9]+\.[0-9]+([-.][a-z0-9.]+)?|release-plz-[0-9TZ-]+|dependabot/.+)$'
          if ! printf '%s\n' "$BRANCH" | grep -Eq "$pattern"; then
            echo "::error::Branch name does not follow Conventional Branch: $BRANCH"
            exit 1
          fi
