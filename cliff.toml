# git-cliff configuration for CHANGELOG.md.
# A release PR runs `git cliff --tag vX.Y.Z -o CHANGELOG.md` after bumping the
# version in Cargo.toml. The output keeps the Keep a Changelog layout.

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

## [Unreleased]
"""
# Commits not yet under a tag are listed under the [Unreleased] heading of the
# header; a tagged version gets its own heading and link.
body = """
{%- if version %}
{%- set bare = version | trim_start_matches(pat="v") %}
{%- if previous and previous.version %}
## [{{ bare }}](https://github.com/nayrosk/overbrainer/compare/{{ previous.version }}...{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else %}
## [{{ bare }}](https://github.com/nayrosk/overbrainer/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{%- endif %}
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message }}
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
topo_order = false
sort_commits = "newest"
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
commit_preprocessors = [
    { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/nayrosk/overbrainer/pull/${1}))" },
]
commit_parsers = [
    { message = "^Merge", skip = true },
    { message = "^feat", group = "added" },
    { message = "^fix", group = "fixed" },
    { message = "^perf", group = "changed" },
    { message = "^refactor", group = "changed" },
    { message = "^docs", group = "documentation" },
    { message = "^(build|chore|ci|style|test)", skip = true },
    { message = "^.*", group = "other" },
]
