[package]
name = "overbrainer"
version = "0.6.1"
edition = "2024"
rust-version = "1.91"
description = "Distill a large LLM into a smaller open-weights model: generate questions, collect answers, fine-tune, visualize."
license = "MIT OR Apache-2.0"
repository = "https://github.com/nayrosk/overbrainer"
readme = "README.md"
keywords = ["llm", "distillation", "fine-tuning", "synthetic-data", "cli"]
categories = ["command-line-utilities", "science"]
include = ["src/**/*", "templates/**/*", "skills/**/*", "LICENSE-*", "README.md"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
cognitive_complexity = "warn"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
# Pinned exact: `unstable-dynamic` enables clap's `unstable-ext` API, which carries
# no semver guarantee. Upgrade clap and clap_complete together.
clap_complete = { version = "=4.6.11", features = ["unstable-dynamic"] }
config = { version = "0.15.26", default-features = false, features = ["toml"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dotenvy = "0.15.7"
fastrand = "2.5.0"
futures = { version = "0.3.34", default-features = false, features = ["std"] }
hf-hub = { version = "1.0.0", default-features = false, features = ["rustls-tls"] }
hmac = { version = "0.13", optional = true }
hyper = { version = "1.11.1", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
minijinja = { version = "2.24.0", default-features = false, features = ["builtins", "debug", "serde"] }
openssh = { version = "0.11.6", default-features = false, features = ["native-mux"] }
prometheus-client = "0.25.1"
rand = { version = "0.10", default-features = false, features = ["thread_rng"], optional = true }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2", "charset"] }
russh = { version = "0.64", default-features = false, features = ["ring"], optional = true }
rustify = { version = "0.7.0", default-features = false }
rustix = { version = "1.1.5", features = ["fs"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = { version = "0.11", optional = true }
sha2 = { version = "0.11.0", default-features = false }
tachyonfx = { version = "0.25.2", default-features = false, features = ["std-duration"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "signal", "net"] }
tokio-util = "0.7.19"
toml_edit = "0.25.15"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tui-tree-widget = "0.24.1"
twox-hash = { version = "2.1.4", default-features = false, features = ["xxhash3_128", "xxhash3_64"] }
url = "2.5.8"
vaultrs = "0.8.0"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.48.0"
predicates = "3.1.4"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["test-util"] }
wiremock = "0.6.5"

# Backtraces keep file and line; full debug info made each test binary link
# take about 1 GB of RAM and a worktree's target/ grow past 15 GB.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[features]
builtin-ssh = ["dep:russh", "dep:rand", "dep:hmac", "dep:sha1"]
