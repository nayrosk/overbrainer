[package]
name = "overbrainer"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Distill a large LLM into a smaller open-weights model: generate questions, collect answers, fine-tune, visualize."
license = "MIT OR Apache-2.0"
repository = "https://github.com/nayrosk/overbrainer"
readme = "README.md"
keywords = ["llm", "distillation", "fine-tuning", "cli", "tui"]
categories = ["command-line-utilities", "science"]
include = ["src/**/*", "templates/**/*", "LICENSE-*", "README.md"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[dependencies]
config = { version = "0.15.26", default-features = false, features = ["toml"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
url = "2.5.8"
vaultrs = "0.8.0"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
